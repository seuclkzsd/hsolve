# Build and runtime environment of hsolve (conda-forge only; docs/INSTALL.md):
#   conda env create -f env/environment.yml && conda activate hsolve
#   (or: micromamba create -f env/environment.yml && micromamba activate hsolve)
# The versions below are the ones the tests, the CI and the release packages use (2026-10).
name: hsolve
channels:
  - conda-forge
  - nodefaults  # conda-forge only, also where a user's .condarc lists other channels
dependencies:
  - python=3.11
  - numpy=2.4
  - scipy=1.17
  - pytest
  # toolchain
  - gcc_linux-64=13
  - gxx_linux-64=13
  - gfortran_linux-64=13
  # glibc 2.17 headers and stubs: what is built here runs on any Linux with glibc >= 2.17
  # (CentOS 7 and newer; tools/release/package.py checks it)
  - sysroot_linux-64=2.17
  - cmake>=3.20
  - ninja
  - make
  - pkg-config
  - patch  # applies the MUMPS patches (tools/dev/build_mumps.sh)
  # numerical libraries (all open source, see docs/DEPENDENCIES.md)
  - mumps-seq=5.8.2
  - mumps-include=5.8.2
  - metis=5.1.0
  - libscotch=7.0
  - openblas=0.3.34
  - libblas=*=*openblas
  - liblapack=*=*openblas
  - zlib
  # header-only / test libraries
  - nlohmann_json=3.12
  - cli11=2.7
  - gtest=1.18
  - pybind11=3.1
