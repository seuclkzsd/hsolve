name: 功能建议
description: 新的求解目标、接口、平台支持或与其它软件的对接
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先看看 [路线图](https://github.com/seuclkzsd/hsolve/blob/main/ROADMAP.md) 中是否已有计划，以及其中「不做什么」一节。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你的电磁问题或工作流程是什么，现在哪里不方便或做不到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 希望 hsolve 怎样支持它；可以给出命令行、配置键或 Python 调用的设想。
    validations:
      required: true
  - type: textarea
    id: scale
    attributes:
      label: 规模与约束
      description: 典型的矩阵阶数与非零元、实数或复数、B 是否正定、需要的特征对个数，以及内存和时间的限制。
  - type: textarea
    id: alternatives
    attributes:
      label: 现有的替代办法
      description: 你现在怎么做（其它软件、脚本），效果如何。
  - type: dropdown
    id: help
    attributes:
      label: 是否愿意参与
      options:
        - 可以提供测试矩阵或验证结果
        - 可以参与实现
        - 暂时只能提出需求
    validations:
      required: true
