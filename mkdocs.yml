# Documentation site of hsolve (https://seuclkzsd.github.io/hsolve/).
#   pip install -r requirements-docs.txt
#   mkdocs serve            # preview at http://127.0.0.1:8000/hsolve/
#   mkdocs build --strict   # what .github/workflows/pages.yml runs
# Root documents (CONTRIBUTING.md, ROADMAP.md, CHANGELOG.md, ...) are published under project/ and
# links to repository files outside docs/ become GitHub links: tools/docs/mkdocs_hooks.py.
site_name: hsolve
site_description: 电磁仿真大规模非正定厄密特征值求解器：位移反演 + 块 Krylov-Schur，带 Sylvester 惯性完备性证书
site_url: https://seuclkzsd.github.io/hsolve/
site_author: seuclkzsd and the hsolve contributors
copyright: Copyright &copy; 2026 seuclkzsd and the hsolve contributors · Apache-2.0
repo_url: https://github.com/seuclkzsd/hsolve
repo_name: seuclkzsd/hsolve
edit_uri: edit/main/docs/

docs_dir: docs
# docs/README.md is the folder index for readers on GitHub; the site's home page is docs/index.md.
exclude_docs: |
  /README.md

hooks:
  - tools/docs/mkdocs_hooks.py

watch:
  - tools/docs
  - CONTRIBUTING.md
  - GOVERNANCE.md
  - MAINTAINERS.md
  - SECURITY.md
  - CODE_OF_CONDUCT.md
  - ROADMAP.md
  - CHANGELOG.md

theme:
  name: material
  language: zh
  # System fonts only: no requests to external font services.
  font: false
  icon:
    repo: fontawesome/brands/github
    logo: material/sine-wave
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Keep Chinese characters in heading ids, like GitHub does.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
      # Inline math only as \( ... \): the existing documents contain shell variables like $HOME.
      inline_syntax: [round]
      block_syntax: [dollar, square, begin]
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/seuclkzsd/hsolve

nav:
  - 首页: index.md
  - 快速开始: guide/quickstart.md
  - 安装与运行: INSTALL.md
  - 用户指南:
      - 命令行: guide/cli.md
      - Python 接口: PYTHON.md
      - 配置与输出格式: FORMATS.md
      - 结果解读与诊断: guide/diagnostics.md
  - 算法原理:
      - 原理概览: guide/algorithms.md
      - 方案说明（全文）: SOLUTION.md
  - 并行方案:
      - 多线程与多进程: PARALLEL.md
      - BLAS 内核与 GPU 卸载: BLAS.md
  - 评测与对比:
      - 评测方法: guide/evaluation.md
      - 困难场景对比: showcase/困难场景对比.md
      - 物理场景: showcase/物理场景.md
      - 研发记录: guide/history.md
  - 设计文档:
      - 设计契约: DESIGN.md
      - 依赖与许可证: DEPENDENCIES.md
  - 开发者指南:
      - 开发与测试: guide/developing.md
      - 参与贡献: project/contributing.md
      - 治理: project/governance.md
      - 维护者: project/maintainers.md
      - 安全策略: project/security.md
      - 行为准则: project/code-of-conduct.md
  - 路线图: project/roadmap.md
  - 更新日志: project/changelog.md
